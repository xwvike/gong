<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>gong · dotcut</title>
<style>
  /* 背景必须真透明——壳那边已经关掉 WebView 的绘制背景了 */
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
               -webkit-user-select:none; cursor:none; }

  /* 进场/退场只走 opacity：CSS 过渡由合成器跑，不受 WebKit 遮挡节流影响，
     是这个主题里唯一还能指望的「自己会动」的东西。 */
  #stage {
    position: fixed; inset: 0;
    opacity: 0;
    transition: opacity .5s ease-out;
    will-change: opacity;
  }
  html.gong-live #stage { opacity: 1; }

  canvas { position: absolute; inset: 0; display: block; }

  @media (prefers-reduced-motion: reduce) {
    #stage { transition-duration: .01ms; }
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="mesh"></canvas></div>

<script>
(() => {
  'use strict';

  const g = window.gong;
  if (g.apiVersion !== 1) throw new Error('unsupported Theme API');

  // ── 这个主题跟原设计稿的三处硬性出入，都是被浮层的运行环境逼的 ──────
  //
  // 1【时钟拆成两半】原稿是一个 rAF 循环，进度也从 rAF 的 dt 累加出来。
  //   这里改成：绝对时刻归壳、帧率归 rAF。壳的 onTick 心跳是权威的绝对
  //   时间但只有 10Hz，rAF 有刷新率但不知道「到点」是哪一刻；所以每次
  //   心跳打一个锚点，两次心跳之间用 performance.now 从锚点往前推。画面
  //   按刷新率走，绝对时刻每 100ms 被校正一次，不累计漂移。见下面 clockNow。
  //   时序常数因此可以照抄原稿（morph 520ms、切片 0.28）。
  //
  // 2【没有指针笔刷】原稿有个跟随光标、平方衰减把圆点擦掉的笔刷。浮层
  //   不接收鼠标事件（nonactivating + cursor:none），这块直接删掉而不是
  //   留着不接线——留着也永远不会触发。
  //
  // 3【背景不填死】原稿把背景整片填成配色里的底色，字是挖穿后露出的底色。
  //   gong 的前提是盖在桌面上而不是盖住桌面，所以底色带 alpha：挖掉的洞
  //   里透出来的是压了色罩的真实桌面。负空间的读法反而更成立。
  //
  // 其余全部照原稿：42 列相切圆、0.75 pitch 内缩、整行数居中、圆盘钻孔成
  // 环的连续中间态、反向缠绕内圆打进同一条 Path2D 走 evenodd 一次提交、
  // 按格分辨率直接光栅化字形、两条独立图案轴（切割 + 纹理）、五种到达时序
  // 配五种到达运动、双色配对交叉混合。

  // ── 配置：原组件的 props 在这里全部写死 ──────────────────────────
  const BASE_COLS = 42;  // 「~42 circles across」，普通屏就是这个数
  const MIN_ROWS = 20;   // 行数下限，见 measure() 里那段
  const MARGIN = 0.75;   // 四边各留 0.75 个 pitch，网格不出血
  const MORPH_MS = 520;  // 原稿值
  const SLICE = 0.28;    // 每格在 morph 里实际运动的时间占比，原稿值
  const STYLE_FLIP = .32;// 纹理轴换场的同名参数，原稿单列了一个值
  const SCENE_MS = 1120; // 图案场景的完整节拍（原稿的 hold 600 + morph 520）
  const OUT_MS   = 2120; // 到点后 OUT 停多久（morph 520 + 静止 1600）
  const EXIT_MS  = 900;  // 塌陷（520）+ 等 CSS 那 .5s 淡出走完
  const SCRIM    = .9;   // 底色不透明度，见上面第 3 条
  const FONT = '-apple-system, "SF Pro Display", "Helvetica Neue", Inter, sans-serif';

  // 原稿的 squareness（超椭圆插值）和 fill（半径缩放）在这里恒为 0 和 1：
  // 圆点必须严格相切才有那些凹菱形，稍微拉开就散成波点，没有可调的余地。
  // 既然没有调用方，这两个分支就不留了。

  // ── 场景表 ────────────────────────────────────────────────────
  //
  // 原稿是 6 个场景无限轮播：1 个字母 + 5 个满幅图案。gong 有生命周期，
  // 正好能吃下原稿那句「一个居中图形被五次整面重组包围，才落得像一个事件
  // 而不是又一张幻灯片」——lead 期间轮播图案，到点那一刻图形砸下来。
  //
  // 【为什么不刻时刻】原稿警告过「这个格子密度下只有粗壮、封闭、高对比的
  // 形状能活下来，细笔画和标点会溶成噪声」。实测证实了：在真实 WKWebView
  // 里按格分辨率光栅化 "18:30"，42 列下每个字符只摊到 7 格，冒号只剩两个
  // 孤点，8/3/0 的内孔跟笔画粘连；加宽到 48、52、60 列依然糊，而 pitch 会
  // 从 44px 掉到 31px，相切圆盘那个质感先没了。"OUT" 三个字母在 42 列下则
  // 干净利落（占 12.3/22 行，O 的内孔完整）。所以这个主题只刻 OUT——反正
  // 原稿本来也只给一个图形，两个图形连着上只会互相稀释。
  //
  // style 是第二条图案轴：它给切割后还立着的格子钻孔（实心盘 → 环），
  // 于是同屏两种图案同时可读。配对刻意跟切割不同轴。
  const PATTERNS = [
    { kind:'rings',   transition:'ripple',   palette:0, style:'grain'  },
    { kind:'columns', transition:'columns',  palette:2, style:'streak' },
    { kind:'checker', transition:'scatter',  palette:3, style:'swell'  },
    { kind:'boxes',   transition:'collapse', palette:4, style:'grain'  },
    { kind:'bars',    transition:'wipe',     palette:5, style:'drift'  },
  ];
  // 唯一的图形。琥珀配红是全表里最像警报的一对，且 palette 1 只有它用，
  // 无论 lead 停在哪个图案上，到点那一下的换色都是一次明确的跳变。
  const OUT_SCENE  = { kind:'text', value:'OUT', transition:'collapse', palette:1, style:'swell' };
  // 退场：目标全空，沿用 OUT 的配色不再换色，整片从边缘往里塌。
  const EXIT_SCENE = { kind:'empty', transition:'collapse', palette:1, style:null };

  const PALETTES = [
    ['#8aa9ff', '#1f45f5'],
    ['#ffd166', '#e5484d'],
    ['#b8f2c9', '#0f8a5f'],
    ['#ffc2e2', '#c81d77'],
    ['#c7d2fe', '#4338ca'],
    ['#fde68a', '#b45309'],
  ];

  // ── 纯函数：时序、运动、纹理、光栅化 ──────────────────────────

  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  const smooth01 = (v, e0, e1) => { const t = clamp01((v - e0) / (e1 - e0)); return t*t*(3 - 2*t); };
  const hash2 = (x, y) => { const s = Math.sin(x*127.1 + y*311.7) * 43758.5453; return s - Math.floor(s); };
  const hash1 = n => { const s = Math.sin(n*127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  // 到达时序：每格一个 0..1 的延迟，决定它在 morph 里什么时候动。
  function cellDelay(kind, x, y, cols, rows, rand) {
    const fx = cols > 1 ? x / (cols - 1) : 0;
    const fy = rows > 1 ? y / (rows - 1) : 0;
    switch (kind) {
      case 'wipe':                                    // 斜向扫过的锋面
        return clamp01((fx*.75 + fy*.25) * .85 + rand*.15);
      case 'ripple': {                                // 从中心扩出的涟漪
        const d = Math.hypot(fx - .5, fy - .5) / .707;
        return Math.min(1, d*.9 + rand*.10);
      }
      case 'scatter':                                 // 每格自己随机
        return rand;
      case 'collapse': {                              // 中心最后出、最先回
        const d = Math.hypot(fx - .5, fy - .5) / .707;
        return Math.min(1, (1 - d)*.85 + rand*.15);
      }
      case 'columns':                                 // 从左到右的列闸门
        return Math.min(1, fx*.9 + rand*.10);
    }
    return 0;
  }

  // 到达运动：第二条轴，是它让每次转场不至于长得像同一个 fade 换了顺序。
  // 位移一律远小于一格、swell 也封了顶，否则格子会撞上邻居、整片从「一个
  // 表面」退化成「一堆散粒」。
  function cellMotion(kind, t, dir, rand) {
    const u = Math.sin(clamp01(t) * Math.PI);
    switch (kind) {
      case 'wipe':     return { s: 1,          dx: u*.16*-dir, dy: 0       }; // 顺着扫描方向倾
      case 'ripple':   return { s: 1 - u*.10,  dx: 0,          dy: u*-.13  }; // 涟漪上抬
      case 'scatter':  return { s: 1,          dx: u*.18*Math.cos(rand*Math.PI*2),
                                                dy: u*.18*Math.sin(rand*Math.PI*2) }; // 各自甩开
      case 'collapse': return { s: 1 - u*.18,  dx: 0,          dy: 0       }; // 先鼓一下再没
      case 'columns':  return { s: 1,          dx: 0,          dy: u*.22   }; // 整列下沉
    }
    return { s: 1, dx: 0, dy: 0 };
  }

  // 纹理轴：给还立着的格子算钻孔深度（0 = 实心盘，1 = 细环）。
  // 换场时从上一个 style 交叉过渡到新的，不是重新长一遍。
  function styleField(style, prevStyle, cols, rows, t, out) {
    const cx = (cols - 1) / 2, cy = (rows - 1) / 2;
    const maxR = Math.hypot(cols, rows) / 2;

    const stateOf = (s, x, y) => {
      switch (s) {
        case 'drift': {                               // 斜向的双正弦漂移
          const a = Math.sin(x*.41 + y*.23);
          const b = Math.sin(x*.17 - y*.53 + 2.1);
          return smooth01((a + b) * .5, -.15, .75);
        }
        case 'grain': {                               // 邻域平滑过的随机颗粒
          const n = hash2(x, y)*.55 + hash2(x+1, y)*.15
                  + hash2(x, y+1)*.15 + hash2(x+1, y+1)*.15;
          return smooth01(n, .34, .86);
        }
        case 'swell': {                               // 带角向扭曲的径向鼓包
          const d = Math.hypot(x - cx, y - cy) / maxR;
          const warp = Math.sin(Math.atan2(y - cy, x - cx) * 3) * .14;
          return smooth01(1 - (d + warp), .28, .92);
        }
        case 'streak': {                              // 被低频包络切断的斜条
          const s2 = Math.sin(x*.28 + y*.62);
          const cut = Math.sin(x*.09 - y*.11 + 1.3) * .5 + .5;
          return smooth01(s2 * cut, -.05, .7);
        }
        default: return 0;
      }
    };

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        let order = 0;
        switch (style) {
          case 'drift':  order = (x/cols)*.75 + Math.sin(y*.5)*.12 + .12; break;
          case 'grain':  order = (x/cols)*.55 + (y/rows)*.25 + hash2(x, y)*.2; break;
          case 'swell':  order = Math.hypot(x - cx, y - cy) / maxR; break;
          case 'streak': order = (x/cols)*.8 + (y/rows)*.2; break;
        }
        const from = stateOf(prevStyle == null ? style : prevStyle, x, y);
        const to = stateOf(style, x, y);
        const u = clamp01((t - order * (1 - STYLE_FLIP)) / STYLE_FLIP);
        out[y*cols + x] = from + (to - from) * (u*u*(3 - 2*u));
      }
    }
  }

  // 光栅化：算出这一场哪些格子留着（1）、哪些被挖掉（0）。
  const glyphCv = document.createElement('canvas');
  const glyphCtx = glyphCv.getContext('2d', { willReadFrequently: true });

  function rasterize(scene, cols, rows) {
    const out = new Uint8Array(cols * rows).fill(1);
    const cx = (cols - 1) / 2, cy = (rows - 1) / 2;

    if (scene.kind === 'empty') return out.fill(0);

    if (scene.kind === 'checker') {
      const b = Math.max(2, Math.round(cols / 14));
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
        if ((Math.floor(x/b) + Math.floor(y/b)) % 2 === 0) out[y*cols + x] = 0;
      return out;
    }
    if (scene.kind === 'bars') {                       // 斜向条带
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
        if (Math.floor((x + y) / 3) % 2 === 0) out[y*cols + x] = 0;
      return out;
    }
    if (scene.kind === 'columns') {                    // 错缝砖砌
      const bw = 4, bh = 3;
      for (let y = 0; y < rows; y++) {
        const shift = Math.floor(y/bh) % 2 === 0 ? 0 : bw/2;
        for (let x = 0; x < cols; x++)
          if (Math.floor((x + shift) / bw) % 2 === 0) out[y*cols + x] = 0;
      }
      return out;
    }
    if (scene.kind === 'boxes') {                      // 同心方环
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const d = Math.max(Math.abs(x - cx), Math.abs(y - cy));
        if (Math.floor(d / 2.5) % 2 === 0) out[y*cols + x] = 0;
      }
      return out;
    }
    if (scene.kind === 'rings') {                      // 同心圆环
      const maxR = Math.hypot(cols, rows) / 2;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const d = Math.hypot(x - cx, y - cy) / maxR;
        if (Math.floor(d * 6) % 2 === 0) out[y*cols + x] = 0;
      }
      return out;
    }

    // 文字：直接在「一格一像素」的画布上排版，而不是画大了再缩。缩出来的
    // 灰阶边缘会让阈值挑出一圈半开的格子，字形边界就糊了。
    const text = scene.value.trim();
    if (!text) return out;

    glyphCv.width = cols; glyphCv.height = rows;
    glyphCtx.fillStyle = '#000'; glyphCtx.fillRect(0, 0, cols, rows);
    glyphCtx.fillStyle = '#fff';
    glyphCtx.textAlign = 'center'; glyphCtx.textBaseline = 'middle';

    // 目标：字形包围盒占网格高度的 58%，四周留一圈完整晶格——原稿那句
    // 「像挖穿一个表面而不是一个边框」。
    //
    // 注意是按【实测包围盒】双向顶到 58%，不是拿字号当高度只做封顶：字号
    // 里含 ascender/descender 的余量，OUT 这种全大写的实际字高只有字号的
    // 七成，只封顶的话图形会缩到 41% 才停，看着像没敢铺开。
    const maxW = cols * .84, maxH = rows * .58;
    let size = maxH;
    const fit = () => { glyphCtx.font = '700 ' + size + 'px ' + FONT; };
    fit();
    const m0 = glyphCtx.measureText(text);
    const gh0 = m0.actualBoundingBoxAscent + m0.actualBoundingBoxDescent;
    if (gh0 > 0) { size *= maxH / gh0; fit(); }

    // 顶完再收：宽了先按宽度收，收完高度自然也在限内
    const w = glyphCtx.measureText(text).width;
    if (w > maxW) { size *= maxW / w; fit(); }

    glyphCtx.fillText(text, cols/2, rows/2);

    const data = glyphCtx.getImageData(0, 0, cols, rows).data;
    for (let i = 0; i < cols*rows; i++) if (data[i*4] > 110) out[i] = 0;
    return out;
  }

  function mixHex(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(((pa >> 16) & 255)*(1-t) + ((pb >> 16) & 255)*t);
    const gg = Math.round(((pa >> 8) & 255)*(1-t) + ((pb >> 8) & 255)*t);
    const bl = Math.round((pa & 255)*(1-t) + (pb & 255)*t);
    return [r, gg, bl];
  }

  // ── 网格状态 ──────────────────────────────────────────────────
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('mesh');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  let cols = BASE_COLS, rows = 3, pitch = 10, ox = 0, oy = 0;
  let mask   = new Uint8Array(0);  // 本场的目标：1 留、0 挖
  let live   = new Float32Array(0);// 每格当前半径系数，0..1 连续
  let from   = new Float32Array(0);// morph 起点：上一帧的 live，不是 0
  let delay  = new Float32Array(0);
  let rnd    = new Float32Array(0);
  let prog   = new Float32Array(0);
  let dir    = new Float32Array(0);
  let bore   = new Float32Array(0);// 钻孔深度，0 = 实心盘

  let curScene = null, prevScene = null, curKey = '';
  let paletteFrom = PATTERNS[0].palette, paletteTo = PATTERNS[0].palette;

  function measure() {
    const cssW = window.innerWidth, cssH = window.innerHeight;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    // 列数是设计点，只在超宽屏上才往上抬。pitch 只由【宽度】决定，屏幕越宽
    // 格子越大、装得下的行数越少：42 列在 16:9 上是 22 行（设计点），到 32:9
    // 就只剩 10 行，OUT 的字形高度不到 6 行，又糊回去了。所以兜一个行数下限，
    // 反解出需要多少列——
    //   rows = H*(cols + 2*MARGIN)/W - 2*MARGIN >= MIN_ROWS
    // 普通 16:9 / 16:10 屏算出来是 37 列，低于 42，这条永远不触发。
    cols = Math.max(BASE_COLS,
      Math.ceil((MIN_ROWS + 2*MARGIN) * cssW / cssH - 2*MARGIN));

    // pitch 由宽度连同两边各 0.75 pitch 的留白一起推出来，再拿剩下的高度
    // 只塞整行。出血的网格会在画面边缘留半个圆，那看着像渲染坏了不像裁切。
    pitch = cssW / (cols + 2*MARGIN);
    rows = Math.max(3, Math.floor((cssH - 2*MARGIN*pitch) / pitch));
    ox = (cssW - cols*pitch) / 2;
    oy = (cssH - rows*pitch) / 2;

    const n = cols * rows;
    mask  = new Uint8Array(n);
    live  = new Float32Array(n);
    from  = new Float32Array(n);
    delay = new Float32Array(n);
    rnd   = new Float32Array(n);
    prog  = new Float32Array(n);
    dir   = new Float32Array(n);
    bore  = new Float32Array(n);
    for (let i = 0; i < n; i++) rnd[i] = hash1(i*1.37 + .5);

    if (curScene) applyScene(curScene, true);
  }

  function applyScene(scene, instant) {
    from.set(live);
    mask = rasterize(scene, cols, rows);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const i = y*cols + x;
      delay[i] = cellDelay(scene.transition, x, y, cols, rows, rnd[i]);
    }
    if (instant) { for (let i = 0; i < mask.length; i++) live[i] = mask[i]; from.set(live); }
  }

  function advance(scene) {
    prevScene = curScene;
    paletteFrom = curScene ? curScene.palette : scene.palette;
    paletteTo = scene.palette;
    curScene = scene;
    applyScene(scene, false);
  }

  // ── 一帧 ─────────────────────────────────────────────────────
  //
  // p 是本次 morph 的绝对进度，全部由 gong.now 现算——不累加 dt，也不数
  // 心跳次数。心跳抖动、掉帧甚至长暂停之后，画面进度依然是对的。
  function draw(p) {
    const n = cols * rows;
    for (let i = 0; i < n; i++) {
      // 每格只在自己那一小段里动，其余时间完全静止
      const local = clamp01((p - delay[i]*(1 - SLICE)) / SLICE);
      live[i] = from[i] + (mask[i] - from[i]) * easeOut(local);
      const changing = from[i] !== mask[i] && p < 1;
      prog[i] = changing ? local : 0;
      dir[i] = mask[i] > from[i] ? 1 : -1;
    }
    styleField(curScene.style, prevScene ? prevScene.style : null, cols, rows, p, bore);

    const W = canvas.width, H = canvas.height, s = dpr;
    const [ca, ba] = PALETTES[paletteFrom % PALETTES.length];
    const [cb, bb] = PALETTES[paletteTo % PALETTES.length];
    const m = easeInOut(clamp01(p));
    const circle = mixHex(ca, cb, m);
    const back = mixHex(ba, bb, m);

    // 底色带 alpha：挖掉的洞里透出来的是压了色罩的桌面（见开头第 3 条）
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(' + back[0] + ',' + back[1] + ',' + back[2] + ',' + SCRIM + ')';
    ctx.fillRect(0, 0, W, H);

    const px = pitch * s;
    const r = px / 2;
    const stroke = Math.max(1.1*s, r*.30);

    // 全场只提交一次：所有实心盘正向、所有内圆反向，攒进同一条 Path2D，
    // evenodd 一填了事。几千次逐格 fill/stroke 才是卡的原因，一条复合路径
    // 才是不卡的原因。
    const path = new Path2D();
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y*cols + x;
        const v = live[i];
        if (v <= .004) continue;

        const mo = cellMotion(curScene.transition, prog[i], dir[i], rnd[i]);
        const cx = ox*s + (x + .5)*px + mo.dx*px;
        const cy = oy*s + (y + .5)*px + mo.dy*px;
        const rr = r * v * mo.s;
        if (rr <= .3) continue;

        path.moveTo(cx + rr, cy);
        path.arc(cx, cy, rr, 0, Math.PI*2);

        // 实心盘从圆心向外钻出一个洞变成环，中间每个半径都合法，所以每格
        // 是自己动画自己的状态，而不是硬切。太小的格子钻不出环，跳过。
        const b = rr > 3.2*s ? (rr - stroke) * bore[i] : 0;
        if (b > .4) { path.moveTo(cx + b, cy); path.arc(cx, cy, b, 0, Math.PI*2, true); }
      }
    }
    ctx.fillStyle = 'rgb(' + circle[0] + ',' + circle[1] + ',' + circle[2] + ')';
    ctx.fill(path, 'evenodd');
  }

  // ── 生命周期 ──────────────────────────────────────────────────
  const reduced = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let revealedAt = 0, morphAt = 0, exitAt = 0, doneSent = false;

  // 时间轴：lead 期间轮播图案，到点砸下 OUT，然后整片塌陷。
  // 每一段都从 g.target 的绝对差值现算，迟到亮相会自动跳到正确的那一段
  //（lead=0 或者页面加载晚了，第一帧直接就是 OUT，不会先补放一遍图案）。
  function sceneAt(now) {
    const dt = now - g.target;
    // 降级模式就是原稿说的「一帧静止画面」：不轮播图案、不做逐格形变，
    // 从亮相到退场一直是挖好的 OUT，退场也只剩 CSS 那一下淡出。
    if (reduced) {
      return dt < OUT_MS ? { key: 'out', scene: OUT_SCENE }
                         : { key: 'exit', scene: EXIT_SCENE };
    }
    if (dt < 0) {
      const i = Math.floor((now - revealedAt) / SCENE_MS) % PATTERNS.length;
      return { key: 'p' + i, scene: PATTERNS[i] };
    }
    if (dt < OUT_MS) return { key: 'out', scene: OUT_SCENE };
    return { key: 'exit', scene: EXIT_SCENE };
  }

  measure();
  // 亮相前先把第一场画一帧预热，真正显示时首帧不空
  curScene = PATTERNS[0];
  applyScene(curScene, false);
  draw(0);

  // 只在尺寸真的变了才重建。ResizeObserver 在 observe() 时会先无条件回调
  // 一次，那一次必须挡掉：measure() 里的 applyScene(_, true) 会把 from 和
  // live 一起钉成终态，插值就没有起点了——第一场的入场形变会整个被吃掉，
  // 亮相时网格直接硬切到位（实测过，不是理论担心）。
  if (typeof ResizeObserver !== 'undefined') {
    let seenW = window.innerWidth, seenH = window.innerHeight;
    new ResizeObserver(() => {
      if (window.innerWidth === seenW && window.innerHeight === seenH) return;
      seenW = window.innerWidth; seenH = window.innerHeight;
      measure();
      draw(curKey ? 1 : 0);
    }).observe(document.body);
  }

  // ── 时钟：绝对时刻归壳，帧率归 rAF ────────────────────────────
  //
  // 壳的心跳是唯一权威的绝对时间，但它只有 10Hz，拿它当画面时钟整场都在抖。
  // rAF 在浮层里是活的（实测满负载 75fps），所以两者分工：
  //   · 每次 onTick 打一个锚点（壳的绝对毫秒 ↔ 当时的 performance.now）
  //   · 两次心跳之间由 performance.now 从锚点往前推
  // 于是画面按刷新率走，而绝对时刻每 100ms 被壳校正一次，不会累计漂移。
  //
  // clockNow 单调不回退：系统校时可能让 epoch 暂时倒退，让画面倒放就太蠢了。
  let anchorGong = 0, anchorPerf = 0, lastClock = 0;
  function clockNow() {
    const t = anchorGong + (performance.now() - anchorPerf);
    if (t > lastClock) lastClock = t;
    return lastClock;
  }

  // 场景推进和绘制都只依赖传进来的绝对时间，所以心跳和 rAF 两条路
  // 调它都得到一致的结果，谁先到都行。
  function update(now) {
    const next = sceneAt(now);
    if (next.key !== curKey) {
      curKey = next.key;
      advance(next.scene);
      morphAt = now;
      if (curKey === 'exit') { exitAt = now; stage.style.opacity = 0; }
    }
    // 降级模式：不做逐格形变，直接把当前这场按最终态画一帧
    draw(reduced ? 1 : clamp01((now - morphAt) / MORPH_MS));
  }

  let rafId = 0;
  function frame() {
    rafId = requestAnimationFrame(frame);
    if (!revealedAt || doneSent) return;
    update(clockNow());
  }

  g.onReveal = () => {
    revealedAt = g.now;
    anchorGong = g.now; anchorPerf = performance.now(); lastClock = g.now;
    if (!reduced) rafId = requestAnimationFrame(frame);
  };

  g.onTick = now => {
    if (!revealedAt || doneSent) return;
    // 重新对锚。心跳的绝对值永远压过本地推算出来的那个。
    if (now > anchorGong) { anchorGong = now; anchorPerf = performance.now(); }

    // 心跳这一路照样完整推进一次：rAF 万一在某些机器/系统版本上被节流掉，
    // 主题会退化成 10fps 而不是卡死。同理，退场闸门只认心跳——doc.md 那条
    // 「不要拿 rAF 当业务时钟或退出闸门」仍然成立，rAF 在这里只补中间帧。
    const t = clockNow();
    update(t);

    if (exitAt && t - exitAt >= EXIT_MS) {
      doneSent = true;
      if (rafId) cancelAnimationFrame(rafId);
      // 每块屏各画各的，不用判断 primary——非主屏这一句会被壳注入的
      // gong.done 安静吃掉
      g.done();
    }
  };
})();
</script>
</body>
</html>
